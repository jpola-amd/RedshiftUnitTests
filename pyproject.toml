[project]
name = "redshift-unit-tests"
version = "0.1.0"
description = "Redshift regression and performance test runner (correctness vs. references, render timings)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "colorama>=0.4.6",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["scenes", "results", "references"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["testrunner/tests"]
pythonpath = ["."]
